version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      npgsql:
        patterns:
          - Npgsql*
      test:
        patterns:
          - xunit*
          - Microsoft.NET.Test.Sdk
          - coverlet.*
    ignore:
      # メジャーバージョンは .NET のバージョンと連動するため、手動で更新する
      - dependency-name: Npgsql*
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns:
          - "*"
