<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">v0.1 から v0.6.0 までの歩み</title>
  <desc id="d">LINQ の練習として始めた v0.1 から、24区のデータ化、番・号への対応、郵便番号 API、自動テスト、大阪府全域への拡張、v0.5.5 の整理を経て、v0.6.0 で PostgreSQL（DbUp・EF Core）に対応するまでのタイムライン。次の目標は v0.7 の Web API・OpenAPI と Spring Boot との比較。</desc>
  <style>
    text { font-family: "Noto Sans JP", "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; fill: #1f2328; }
    .h { font-size: 20px; font-weight: 700; }
    .v { font-size: 13px; font-weight: 700; fill: #8250df; }
    .t { font-size: 15px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #59636e; }
    .dot { fill: #ffffff; stroke: #8250df; stroke-width: 3; }
    .stem { stroke: #d0d7de; stroke-width: 1.5; }
  </style>

  <rect x="0" y="0" width="960" height="440" rx="18" fill="#f6f8fa"/>
  <text x="32" y="44" class="h">はじめての C# から v0.6.0 まで</text>
  <text x="32" y="68" class="s">Java（Spring Boot）エンジニアが、ASP.NET Core MVC で一歩ずつ作ってきた記録。</text>

  <!-- timeline axis -->
  <line x1="64" y1="222" x2="840" y2="222" stroke="#8250df" stroke-width="3"/>
  <line x1="840" y1="222" x2="918" y2="222" stroke="#8250df" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M912 214 L924 222 L912 230 z" fill="#8250df"/>

  <!-- v0.1 (above) -->
  <line x1="84" y1="130" x2="84" y2="214" class="stem"/>
  <circle cx="84" cy="222" r="8" class="dot"/>
  <text x="30" y="102" class="v">v0.1</text>
  <text x="30" y="122" class="t">LINQ の練習</text>
  <text x="92" y="160" class="s">Where / Select で</text>
  <text x="92" y="177" class="s">区名を検索</text>

  <!-- v0.2 (below) -->
  <line x1="192" y1="230" x2="192" y2="300" class="stem"/>
  <circle cx="192" cy="222" r="8" class="dot"/>
  <text x="138" y="276" class="v">v0.2</text>
  <text x="138" y="296" class="t">24区・580町名</text>
  <text x="138" y="318" class="s">区ごとの JSON に分離</text>
  <text x="138" y="335" class="s">jQuery を撤去</text>

  <!-- v0.2.1 (above) -->
  <line x1="300" y1="130" x2="300" y2="214" class="stem"/>
  <circle cx="300" cy="222" r="8" class="dot"/>
  <text x="246" y="102" class="v">v0.2.1</text>
  <text x="246" y="122" class="t">番・号に対応</text>
  <text x="308" y="160" class="s">角田町5-15 を</text>
  <text x="308" y="177" class="s">作れないバグを修正</text>

  <!-- v0.3 (below) -->
  <line x1="408" y1="230" x2="408" y2="300" class="stem"/>
  <circle cx="408" cy="222" r="8" class="dot"/>
  <text x="354" y="276" class="v">v0.3</text>
  <text x="354" y="296" class="t">郵便番号 API</text>
  <text x="354" y="318" class="s">HttpClient・async/await</text>
  <text x="354" y="335" class="s">外部 API 障害を隔離</text>

  <!-- v0.4 (above) -->
  <line x1="516" y1="130" x2="516" y2="214" class="stem"/>
  <circle cx="516" cy="222" r="8" class="dot"/>
  <text x="462" y="102" class="v">v0.4</text>
  <text x="462" y="122" class="t">テストを書く</text>
  <text x="524" y="160" class="s">起動時のデータ検証</text>
  <text x="524" y="177" class="s">xUnit を導入</text>

  <!-- v0.5 (below) -->
  <line x1="624" y1="230" x2="624" y2="300" class="stem"/>
  <circle cx="624" cy="222" r="8" class="dot"/>
  <text x="570" y="276" class="v">v0.5</text>
  <text x="570" y="296" class="t">大阪府全域へ</text>
  <text x="570" y="318" class="s">43市町村・72地域</text>
  <text x="570" y="335" class="s">町名の自由入力</text>

  <!-- v0.5.5 (above) -->
  <line x1="732" y1="130" x2="732" y2="214" class="stem"/>
  <circle cx="732" cy="222" r="8" class="dot"/>
  <text x="678" y="102" class="v">v0.5.5</text>
  <text x="678" y="122" class="t">整理・テスト強化</text>
  <text x="740" y="160" class="s">Options パターン</text>
  <text x="740" y="177" class="s">Git で管理を開始</text>

  <!-- v0.6.0 (below, current) -->
  <line x1="840" y1="232" x2="840" y2="250" class="stem"/>
  <circle cx="840" cy="222" r="10" fill="#8250df"/>
  <rect x="772" y="250" width="172" height="124" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="788" y="274" class="v">v0.6.0（現在）</text>
  <text x="788" y="296" class="t">PostgreSQL へ</text>
  <text x="788" y="318" class="s">DbUp・EF Core</text>
  <text x="788" y="335" class="s">JSON と DB を切り替え</text>
  <text x="788" y="352" class="s">67 テスト（成功 64）</text>

  <!-- next -->
  <line x1="32" y1="396" x2="928" y2="396" stroke="#d0d7de" stroke-width="1"/>
  <text x="32" y="420" class="v" style="fill:#59636e">次：v0.7</text>
  <text x="104" y="420" class="s">住所を正規化する Web API と OpenAPI ／ 同じ API を Spring Boot でも作り、Java と C# を並べて比べる</text>
</svg>
